# Tunable settings. Secrets go in .env, never here.

safety:
  # Design doc section 8: tier 3 when P(3) >= theta3; tier 2 when P(2) + P(3) >= theta2.
  # Both start at 0.5 (proposed) until the threshold sweep (FR-61).
  theta3: 0.5
  theta2: 0.5
  jev_model: jev-latest
  jev_timeout_s: 2.0
  history_turns: 4          # previous turns sent to Jev as state
  fallback_model: claude-haiku-5-5
  fallback_timeout_s: 5.0

persona:
  default: socrates
  voice_model: claude-sonnet-5-5

retrieval:
  k: 5
  min_score: null           # null: use the retrieval default (PHILOCAFE_MIN_SCORE, else 0.3)
