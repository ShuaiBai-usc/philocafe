# Tunable settings. Secrets go in .env, never here.

safety:
  # Design doc section 8: tier 3 when P(3) >= theta3; tier 2 when P(2) + P(3) >= theta2.
  # Both start at 0.5 (proposed) until the threshold sweep (FR-61).
  theta3: 0.5
  theta2: 0.5
  jev_model: jev-latest
  jev_timeout_s: 2.0
  history_turns: 4          # previous turns sent to Jev as state
  # FR-32: in support mode the persona comes back only below this P(2) + P(3), judged on what
  # the user said since the pause (not the message that caused it). theta3 still applies.
  return_theta2: 0.5
  fallback_model: claude-haiku-5-5
  fallback_timeout_s: 5.0

persona:
  default: socrates
  voice_model: claude-sonnet-5-5
  voice_effort: low
  notes_model: claude-haiku-5-5   # "Save thought" notes (FR-07)

retrieval:
  k: 5
  min_score: null           # null: use the retrieval default (PHILOCAFE_MIN_SCORE, else 0.3)
  # Non-English questions are translated into English before retrieval (the corpus is English).
  translate_model: claude-haiku-5-5
  translate_timeout_s: 5.0

voice:
  # Voice conversation (design doc 7.6): speech-to-text in, text-to-speech out.
  # provider: openai (OPENAI_API_KEY) or elevenlabs (ELEVENLABS_API_KEY); PHILOCAFE_VOICE_PROVIDER overrides it.
  provider: elevenlabs
  # OpenAI: both announced for shutdown in early 2027 (after the course).
  transcribe_model: gpt-4o-mini-transcribe
  speech_model: gpt-4o-mini-tts
  # ElevenLabs: Flash is the fast, cheaper voice model; eleven_multilingual_v2 sounds richer at twice the credits.
  elevenlabs_tts_model: eleven_flash_v2_5
  elevenlabs_stt_model: scribe_v2
