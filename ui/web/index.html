<meta charset="utf-8">
<title>Philocafé Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b4e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Philocafé">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&family=Silkscreen&display=swap">
<style>
/* Tokens and sizes follow the Figma file "Philocafe · Mobile App UI". */
:root {
  --paper: #fffae0;      /* page */
  --white: #faedcd;      /* cards, philosopher bubble */
  --ink: #6b4e2e;        /* outlines, text */
  --muted: #79694f;
  --sage: #e9edc9;       /* user bubble, title bars */
  --clay: #d4aa73;       /* primary button, thin lines */
  --shadow: #cca370;     /* 3px 4px drop shadows */
  --rust: #8c524a;       /* destructive action: low-saturation dark red */
  --table: #2f261c;      /* desktop surround */
  --f-display: "Pixelify Sans", "Courier New", monospace;   /* headings: pixel face like the rest of the app */
  --f-pixel: "Pixelify Sans", "Courier New", monospace;
  --f-label: "Silkscreen", "Courier New", monospace;
  --f-mono: "Pixelify Sans", "Courier New", monospace;
  --pad-l: max(18px, env(safe-area-inset-left, 0px));
  --pad-r: max(18px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--table); color: var(--ink); font-family: var(--f-pixel); overflow: hidden; }
img.px, .px img { image-rendering: pixelated; }
button, textarea { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }
p { margin: 0; }

.stage { height: 100%; display: flex; align-items: center; justify-content: center; gap: 40px; }
.phone { position: relative; width: 100%; height: 100%; background: var(--paper); overflow: hidden; display: flex; flex-direction: column; }
.status, .homebar { display: none; }
@media (min-width: 560px) and (min-height: 700px) {
  .phone { width: 390px; height: min(844px, 100%); border-radius: 30px; box-shadow: 0 0 0 10px #191410, 0 30px 80px rgba(0,0,0,.5); }
  .status { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 26px; flex: none; font: 16px var(--f-display); }
  .homebar { display: block; width: 132px; height: 5px; border-radius: 2px; background: var(--ink); margin: 14px auto 8px; flex: none; }
}
.screens { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px max(24px, env(safe-area-inset-right, 0px)) 20px max(24px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* ---------- Shared pixel pieces ---------- */
.card { position: relative; background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); }
.titlebar { height: 28px; padding: 5px 10px 0; background: repeating-linear-gradient(to bottom, var(--sage) 0 2px, var(--paper) 2px 4px);
  font: 12px/14px var(--f-label); letter-spacing: .1em; text-transform: uppercase; }
.card > .titlebar { margin: -2px -2px 0; }
.card .inner { padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 8px; }
.primary { flex: none; width: 100%; height: 54px; background: var(--clay); border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); font: 16px/21px var(--f-pixel); }
.primary:active, .chip:active, .pill:active { transform: translate(2px, 2px); box-shadow: 1px 2px 0 var(--shadow); }
.ico { width: 22px; height: 22px; flex: none; display: block; }
.muted { color: var(--muted); }
.t11 { font-size: 11px; line-height: 14px; }
.t14 { font-size: 14px; line-height: 19px; }
.t16 { font-size: 16px; line-height: 21px; }
.t20 { font-size: 20px; line-height: 26px; }
.t28 { font-size: 28px; line-height: 36px; }

/* ---------- Bottom navigation ---------- */
.tabs { flex: none; background: var(--ink); display: flex; justify-content: center; gap: 18px; padding: 8px 24px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tab { width: 102px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0; color: var(--paper); font-size: 11px; line-height: 14px; opacity: .72; }
.tab[aria-current="page"] { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 01 The Café ---------- */
#home .body { align-items: center; gap: 8px; padding-left: 16px; padding-right: 16px; }
.brand { position: relative; width: 300px; max-width: 100%; height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: 1px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow);
  background: repeating-linear-gradient(to bottom, var(--sage) 0 2px, #f4f3d4 2px 4px); font-size: 24px; line-height: 28px; }
.hint { text-align: center; }
.hint.flash { animation: flash .9s steps(2) 2; }
.cafe { position: relative; width: 300px; max-width: 100%; aspect-ratio: 1179 / 2556; flex: none; border: 2px solid var(--ink); overflow: hidden; }
.cafe > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.actor { position: absolute; }
.actor img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.seat { position: absolute; z-index: 2; min-width: 44px; min-height: 44px; }

/* ---------- 02 Meet ---------- */
#meet .body { gap: 16px; }
.backlink { display: flex; gap: 8px; align-items: center; align-self: flex-start; font-size: 16px; line-height: 21px; min-height: 32px; }
.portrait { width: 204px; height: 230px; flex: none; align-self: center; border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); object-fit: cover; }
.intro { display: flex; flex-direction: column; gap: 3px; }
.foot { flex: none; padding: 10px max(24px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }

/* ---------- 03 / 04 Conversation ---------- */
.convhead { display: flex; align-items: center; gap: 12px; padding: 12px var(--pad-r) 0 var(--pad-l); flex: none; }
.back { width: 32px; height: 44px; display: grid; place-items: center; flex: none; }
.mono { width: 52px; height: 52px; border: 1px solid var(--clay); flex: none; }
.convhead h1 { margin: 0; font: 400 20px/1.3 var(--f-display); }
.convhead > div { min-width: 0; }
.convhead .sub { font: 11px/1.4 var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { margin-left: auto; align-self: flex-start; margin-top: 6px; font: 9px var(--f-label); letter-spacing: .08em; border: 2px solid var(--muted); color: var(--muted); padding: 1px 4px; }
.mode.live { border-color: #6f8a55; color: #55703d; }

.scene-wrap { margin: 12px var(--pad-r) 0 var(--pad-l); border: 2px solid var(--ink); position: relative; overflow: hidden; flex: none; aspect-ratio: 354 / 164; transition: aspect-ratio .5s ease; }
#chat.convo .scene-wrap { aspect-ratio: 354 / 110; }
.scene { position: absolute; left: 0; bottom: 0; width: 100%; }
.scene .frame { position: absolute; overflow: hidden; inset: 0; }

.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px var(--pad-r) 16px var(--pad-l); display: flex; flex-direction: column; gap: 12px; }
#chat.convo .scroll { gap: 18px; padding-top: 14px; }
.headline { margin: 0; font: 400 26px/32px var(--f-display); text-wrap: balance; }
.greet .body2 { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
.greet .pic { width: 62px; height: 62px; border: 2px solid var(--ink); flex: none; }
.say { flex: 1; min-width: 0; min-height: 78px; background: var(--paper); border: 2px solid var(--ink); padding: 9px 10px 18px; font-size: 15px; line-height: 20px; position: relative; }
.say::after { content: "▾"; position: absolute; right: 10px; bottom: 2px; font-size: 12px; animation: blink 1s steps(1) infinite; }
.say.typing::after { content: "▌"; position: static; animation: none; }
.label { font: 8px/10px var(--f-label); letter-spacing: .1em; text-transform: uppercase; }
.chips { display: flex; flex-direction: column; gap: 9px; }
.chip { text-align: left; background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); padding: 8px 12px; font-size: 16px; line-height: 21px; white-space: pre-wrap; }

.row { display: flex; gap: 16px; align-items: flex-start; position: relative; }
.row.me { justify-content: flex-end; }
.row .ava { width: 42px; height: 42px; border: 2px solid var(--ink); flex: none; }
.bubble { position: relative; max-width: 286px; min-width: 0; background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); padding: 10px 14px; font-size: 16px; line-height: 21px; white-space: pre-wrap; overflow-wrap: anywhere; }
.row.me .bubble { background: var(--sage); max-width: 286px; }
.row.them { padding-right: 12px; }
.row.me { padding-left: 40px; }
.tail { position: absolute; top: 10px; width: 14px; height: 14px; }
.row.them .tail { left: 44px; }
.row.me .tail { right: 0; }
.dots { display: inline-flex; gap: 8px; padding: 6px 2px; }
.dots i { width: 7px; height: 7px; background: var(--ink); animation: hop .9s steps(2) infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }

/* Reply actions (7.9): small pixel icons under each persona reply */
.acts { display: flex; gap: 2px; margin: -8px 0 0 58px; }
#chat.convo .acts { margin-top: -12px; }
.acts button { width: 30px; height: 30px; display: grid; place-items: center; }
.acts button:focus-visible { outline: 2px dashed var(--clay); outline-offset: -2px; }
.acts button:disabled { opacity: .4; cursor: default; }
.acts:not(.latest) .regen { display: none; }
.acts button { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.feedback { text-align: left; }
.feedback .inner { padding: 14px 18px 16px; gap: 10px; }
.feedback .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.feedback .tag { border: 2px solid var(--ink); background: var(--paper); padding: 6px 10px; font-size: 14px; line-height: 18px; }
.feedback .tag[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.feedback textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--clay); background: var(--paper); padding: 8px 10px; font-size: 16px; line-height: 21px; }
.feedback textarea::placeholder { color: var(--muted); }
.feedback .btn.go { background: var(--clay); }
.more { width: 30px; height: 30px; display: grid; place-items: center; flex: none; align-self: flex-start; margin: 2px -6px 0 -4px; border: 2px solid transparent; }
.more[aria-expanded="true"] { border-color: var(--ink); background: var(--white); }
.menu { position: absolute; right: var(--pad-r); top: 58px; z-index: 15; width: 230px; animation: popin .2s steps(3); }
.menu .inner { padding: 6px 0 8px; gap: 0; }
.menu button { display: block; width: 100%; text-align: left; padding: 9px 14px; font-size: 15px; line-height: 20px; }
.menu button:hover, .menu button:focus-visible { background: var(--sage); }
.menu .style { padding: 8px 14px 4px; border-top: 1px dashed var(--clay); margin-top: 4px; }
.toast { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -6px); background: var(--ink); color: var(--paper); font-size: 13px; padding: 6px 10px; white-space: nowrap; animation: popin .2s steps(3); }

.dock { flex: none; padding: 0 var(--pad-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--pad-l); position: relative; }
.composer { height: 62px; background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); padding: 8px; display: flex; gap: 9px; align-items: center; }
.composer input { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--ink); background: var(--paper); padding: 0 10px; font: 16px var(--f-pixel); color: var(--ink); border-radius: 0; }
.composer input::placeholder { color: var(--ink); opacity: .55; }
.composer .send { width: 36px; height: 40px; border: 2px solid var(--ink); background: var(--sage); font-size: 18px; flex: none; }
.composer .send:disabled, .composer input:disabled { opacity: .5; cursor: default; }
.dock .note { text-align: center; margin-top: 8px; }

/* 07 distress state */
.syscheck { text-align: center; }
.youcard { align-self: flex-end; width: min(282px, 88%); background: var(--sage); border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.composer.quiet { height: 56px; border: 1px solid var(--clay); box-shadow: none; padding: 0 12px 0 16px; justify-content: space-between; color: var(--muted); }
.composer.quiet span:last-child { width: 32px; height: 32px; display: grid; place-items: center; background: var(--clay); border: 1px solid var(--ink); color: var(--ink); font-size: 20px; }

/* ---------- Popups ---------- */
.veil { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 0 24px;
  background: repeating-conic-gradient(rgba(107,78,46,.28) 0 25%, rgba(107,78,46,.12) 0 50%) 0 0 / 4px 4px; }
.pop { width: 100%; max-width: 342px; animation: popin .25s steps(4); }
.pop .titlebar { display: flex; align-items: center; gap: 6px; }
.pop .titlebar img { width: 14px; height: 14px; }
.pop .x { margin-left: auto; width: 20px; height: 20px; margin-top: -3px; border: 2px solid var(--ink); background: var(--paper); font: 12px/14px var(--f-label); }
.pop-body { padding: 18px 16px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 15px; line-height: 1.5; }
.pop-body img { width: 64px; }
.btns { display: flex; gap: 12px; width: 100%; margin-top: 4px; }
.btn { flex: 1; border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); padding: 10px 0; font: 13px var(--f-label); letter-spacing: .14em; background: var(--paper); }
.btn.go { background: var(--sage); }
.source .inner { padding: 14px 24px 16px; gap: 8px; }
.source .close { align-self: flex-start; font-size: 16px; line-height: 21px; padding: 4px 0; }

/* ---------- 05 My Notes ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-width: 100px; height: 40px; padding: 0 16px; background: var(--white); border: 2px solid var(--ink); box-shadow: 3px 4px 0 var(--shadow); font-size: 12px; line-height: 16px; }
.pill[aria-pressed="true"] { background: var(--sage); }
.note-card { text-align: left; width: 100%; }
.note-card .inner { padding: 12px 22px 14px; }
.note-card .meta { margin-top: 2px; }
.note-card.example .titlebar { font-style: italic; }
.notehead { display: flex; gap: 8px; align-items: center; }
/* The note window is capped to the screen area above the tab bar: a definite grid row lets
   max-height resolve, and the bottom padding leaves room for the 4px drop shadow. */
.veil.notesveil { grid-template-rows: minmax(0, 1fr); padding: 12px 24px 8px; }
.notepop { max-height: 100%; overflow-y: auto; text-align: left; }
.notepop .inner { padding: 14px 20px 18px; gap: 10px; }
.notepop .t11 + .t28 { margin-top: -2px; }
.notepop hr { border: 0; border-top: 1px dashed var(--clay); margin: 4px 0; width: 100%; }
.notepop .label { margin-top: 2px; }
.excerpt { display: flex; flex-direction: column; gap: 8px; }
.excerpt .line { border: 2px solid var(--ink); padding: 8px 10px; background: var(--paper); }
.excerpt .line.me { background: var(--sage); margin-left: 28px; }
.excerpt .line.them { margin-right: 28px; }
.excerpt .who { font: 8px/10px var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.excerpt .cites { margin-top: 8px; border-top: 1px dashed var(--clay); }
.excerpt .cite { padding: 8px 0 2px; }
.notepop .btn.del { background: var(--rust); color: var(--paper); }
.notepop .btn.done { background: var(--clay); color: var(--ink); }
.notepop textarea { width: 100%; min-height: 84px; resize: vertical; cursor: text; border: 1px solid var(--clay); background: var(--paper); padding: 8px 10px; font-size: 16px; line-height: 21px; }
.notepop textarea::placeholder { color: var(--muted); }
.empty { padding: 18px; text-align: center; }

/* ---------- Conversations (7.10): one section per philosopher, a card per conversation ---------- */
.csec { display: flex; flex-direction: column; gap: 10px; }
.csec-head { display: flex; align-items: center; gap: 10px; }
.csec-head img { width: 34px; height: 34px; border: 2px solid var(--ink); }
.csec-head h2 { margin: 0; font: 400 20px/1.2 var(--f-display); flex: 1; }
.csec-head .newc { font-size: 13px; line-height: 16px; padding: 6px 8px; border: 2px solid var(--ink); background: var(--paper); box-shadow: 2px 3px 0 var(--shadow); }
.ccard { text-align: left; width: 100%; }
.ccard .titlebar { display: flex; align-items: center; }
.ccard .titlebar .when { flex: 1; min-width: 0; }
.ccard .x { width: 20px; height: 20px; margin-top: -3px; border: 2px solid var(--ink); background: var(--paper); font: 12px/14px var(--f-label); flex: none; display: grid; place-items: center; }
.ccard .ctitle { font-size: 17px; line-height: 22px; }
.ccard .inner { padding: 10px 16px 12px; gap: 4px; }
.ccard .last { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cempty { border: 2px dashed var(--clay); padding: 12px 14px; text-align: left; width: 100%; color: var(--muted); }
.btn.danger { background: var(--rust); color: var(--paper); }
.menu .danger-text { color: var(--rust); }
.account .switch { text-decoration: underline; color: var(--ink); }
.account .err { color: var(--rust); }
.account .codein + .codein { margin-top: -4px; }

/* ---------- 06 Pause ---------- */
#pause .rest { width: 100%; height: 160px; object-fit: cover; flex: none; }
#pause .body { padding-top: 24px; gap: 12px; }
.support { padding: 12px; display: flex; flex-direction: column; gap: 5px; }

/* ---------- Side notes (wide screens) ---------- */
.notes { display: none; max-width: 300px; color: #e9dcc0; font: 15px/1.6 var(--f-pixel); }
.notes h2 { font-family: var(--f-display); font-weight: 500; font-size: 30px; margin: 0 0 8px; color: #fdf7e3; }
.notes button { color: #fdf7e3; text-decoration: underline; font-family: var(--f-pixel); text-align: left; }
.notes ul { padding-left: 18px; margin: 8px 0; }
@media (min-width: 900px) and (min-height: 700px) { .notes { display: block; } }

/* ---------- Backend integration (PhiloCafe server) ---------- */
.primary:disabled { opacity: .5; cursor: default; box-shadow: none; }
.coming { text-align: center; margin-top: 8px; }
.source .inner { max-height: 70vh; overflow-y: auto; }
.cite { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--clay); }
.cite:last-of-type { border-bottom: 0; }
.cite blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--clay); }
.cite summary { cursor: pointer; }
.cite .passage { white-space: pre-wrap; margin-top: 6px; }
.cite a { color: var(--ink); }
.sysnote .inner p + p { margin-top: 4px; }
.netnote { text-align: center; }
.comeback { display: flex; flex-direction: column; gap: 9px; margin-bottom: 12px; }
.codein { width: 100%; height: 40px; border: 1px solid var(--ink); background: var(--paper); padding: 0 10px; font: 16px var(--f-pixel); color: var(--ink); border-radius: 0; }
#debugPanel { position: fixed; left: 8px; bottom: 8px; z-index: 50; max-width: 360px; max-height: 45vh; overflow: auto; margin: 0; padding: 8px 10px;
  background: rgba(47,38,28,.92); color: #fffae0; font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; }   /* developer panel, not app text */

@keyframes blink { 50% { opacity: 0; } }
@keyframes hop { 50% { transform: translateY(-3px); } }
@keyframes popin { from { transform: scale(.9); opacity: 0; } }
@keyframes flash { 50% { background: var(--sage); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="stage">
  <div class="phone" id="phone">
    <div class="status" aria-hidden="true"><span>9:41</span><span>●&nbsp;&nbsp;▰</span></div>
    <div class="screens">
      <section class="screen" id="home" aria-label="The café">
        <div class="body">
          <div class="brand"><span data-icon="cup"></span>Philocafé</div>
          <p class="hint t11 muted" id="hint">Tap a philosopher in the café to meet them.</p>
          <div class="cafe" id="cafe"><img class="bg px" src="assets/home_bg.png" alt=""></div>
        </div>
      </section>
      <section class="screen" id="meet" hidden></section>
      <section class="screen" id="chat" hidden></section>
      <section class="screen" id="notes" hidden></section>
      <section class="screen" id="convos" hidden></section>
      <section class="screen" id="pause" hidden></section>
    </div>
    <nav class="tabs" id="tabs" aria-label="Main">
        <button class="tab" data-tab="home"><span data-icon="cup" data-color="paper"></span>Café</button>
        <button class="tab" data-tab="chat"><span data-icon="chat" data-color="paper"></span>Conversations</button>
        <button class="tab" data-tab="notes"><span data-icon="mark" data-color="paper"></span>My notes</button>
    </nav>
    <div class="homebar" id="homebar" aria-hidden="true"></div>
  </div>
  <aside class="notes">
    <h2>Philocafé</h2>
    <p>Clickable prototype for 586, built from the Figma file. Tap a philosopher in the café, meet them, take a seat and talk. Save a thought to keep it in My notes.</p>
    <p>Jump to:</p>
    <ul>
      <li><button data-go="socrates">Meet Socrates</button></li>
      <li><button data-go="montaigne">Meet Montaigne</button></li>

// An actor is one <img> that steps through the timeline recovered from the GIF exports.
function actor(key, W, H) {
  const d = DATA[key], [x0, y0, x1, y1] = d.box;
  const box = el("div", "actor px");
  Object.assign(box.style, { left: x0 / W * 100 + "%", top: y0 / H * 100 + "%", width: (x1 - x0) / W * 100 + "%", height: (y1 - y0) / H * 100 + "%" });
  const img = el("img"); img.alt = ""; img.src = A + d.frames[d.seq[0][0]];
  if (d.flip) img.style.transform = "scaleX(-1)";   // face the table on the seat's left
  box.append(img);
  let i = 0, t = null, alive = true;
  const step = () => {
    if (!alive) return;
    const [f, ms] = d.seq[i];
    img.src = A + d.frames[f];
    i = (i + 1) % d.seq.length;
    t = setTimeout(step, ms);
  };
  if (!reduce) step();
  box.stop = () => { alive = false; clearTimeout(t); };
  return box;
}

let screen = "home";
function show(id) {
  screen = id;
  SCREENS.forEach(s => { $("#" + s).hidden = s !== id; });
  $("#tabs").hidden = !(id in TABBED);
  document.querySelectorAll(".tab").forEach(t => t.toggleAttribute("aria-current", false));
  if (TABBED[id]) $(`.tab[data-tab="${TABBED[id]}"]`).setAttribute("aria-current", "page");
  $("#homebar").hidden = id in TABBED;
  document.querySelector(".veil")?.remove();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  const to = t.dataset.tab;
  if (to === "chat") { renderConvos(); return show("convos"); }
  if (to === "notes") { renderNotes(); loadNotes().then(() => screen === "notes" && renderNotes()).catch(() => {}); }
  show(to);
});

/* ---------- Backend (design doc 7.2) ---------- */
// Live when this page is served by the PhiloCafe server: every turn goes through the
// safety node first, and the server decides when the café pauses. Opened any other way
// (e.g. from the file), the page falls back to the scripted demo lines.
const DEBUG = /debug/.test(location.hash + location.search);
const backend = {
  live: false,
  ids: new Set(),
  me: null,                 // {nickname, prefs, paused} of the signed-in account (7.10)
  // The deployed café asks for an access code (ADR-11); it is kept on this device only.
  code() { try { return localStorage.getItem("philocafe.code") || ""; } catch { return ""; } },
  setCode(c) { try { c ? localStorage.setItem("philocafe.code", c) : localStorage.removeItem("philocafe.code"); } catch {} },
  // The account token (7.10): the café's server keeps everything else.
  token() { try { return localStorage.getItem("philocafe.token") || ""; } catch { return ""; } },
  setToken(t) { try { t ? localStorage.setItem("philocafe.token", t) : localStorage.removeItem("philocafe.token"); } catch {} },
  headers(extra = {}) {
    const h = { ...extra }, c = this.code(), t = this.token();
    if (c) h["X-Philocafe-Code"] = c;
    if (t) h.Authorization = `Bearer ${t}`;
    return h;
  },
  async init() {
    try {
      const r = await fetch("personas", { cache: "no-store", headers: this.headers() });
      if (r.status === 401) { this.live = false; askCode(this.code() ? "That code didn’t open the café. Please try again." : ""); return; }
      if (!r.ok) throw new Error(r.status);
      this.ids.clear();
      (await r.json()).filter(p => p.available).forEach(p => this.ids.add(p.id));
      this.live = true;
    } catch { this.live = false; return; }
    if (!this.token()) return askAccount();
    try { await this.loadMe(); await loadNotes(); } catch {}
  },
  available(id) { return !this.live || this.ids.has(id); },
  // JSON calls to the café's API; a lost sign-in or access code asks again.
  async api(path, { method = "GET", body } = {}) {
    const r = await fetch(path, { method, cache: "no-store", headers: this.headers(body ? { "Content-Type": "application/json" } : {}),
                                  ...(body ? { body: JSON.stringify(body) } : {}) });
    if (r.status === 401) {
      let code = ""; try { code = (await r.clone().json()).error.code; } catch {}
      if (code === "access_code") { this.setCode(""); askCode("That code no longer opens the café."); }
      else { this.setToken(""); this.me = null; askAccount("Please sign in again."); }
    }
    if (!r.ok) { let e = { code: String(r.status) }; try { e = (await r.json()).error; } catch {} throw Object.assign(new Error(e.code), e); }
    return r.status === 204 ? null : r.json();
  },
  async loadMe() { this.me = await this.api("me"); return this.me; },
  paused() { return !!this.me?.paused; },
  setPaused(v) { if (this.me) this.me.paused = v; },
  async newThread(personaId) { return (await this.api("threads", { method: "POST", body: { persona_id: personaId } })).thread_id; },
  threads() { return this.api("threads"); },
  history(id) { return this.api(`threads/${id}`); },
  deleteThread(id) { return this.api(`threads/${id}`, { method: "DELETE" }); },
  // `regenerate` answers the latest message again (FR-41). The server reads the account's
  // reply preferences itself (7.9); one conversation is one philosopher (7.10).
  async *turn(thread, text, intent, regenerate = false) {
    const body = regenerate ? { regenerate: true } : { text, ...(intent ? { intent } : {}) };
    const r = await fetch(`threads/${thread}/messages`, { method: "POST", headers: this.headers({ "Content-Type": "application/json" }),
                                                        body: JSON.stringify(body) });
    if (r.status === 401) {
      let code = ""; try { code = (await r.clone().json()).error.code; } catch {}
      if (code === "access_code") { this.setCode(""); askCode("That code no longer opens the café."); } else { this.setToken(""); askAccount("Please sign in again."); }
    }
    if (!r.ok) {
      let e = { code: String(r.status), message: "request failed" };
      try { e = (await r.json()).error; } catch {}
      yield { type: "error", data: e };
      return;
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, cut); buf = buf.slice(cut + 2);
        let type = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event: ")) type = line.slice(7);
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        yield { type, data: data ? JSON.parse(data) : {} };
      }
    }
  },
  note(ex) { return this.api(`threads/${ex.thread}/note`, { method: "POST", body: { message_id: ex.messageId } }); },   // 7.7: stored on the server
  async rate(rating, ex, feedback = null) {   // 7.9: a thumb (or its feedback window) -> the account's reply preferences
    const j = await this.api("preferences", { method: "POST", body: { thread_id: ex.thread, message_id: ex.messageId, rating, ...(feedback ? { feedback } : {}) } });
    if (this.me) this.me.prefs = j.prefs;
    return j.prefs;
  }
};

/* ---------- Account (7.10): a nickname and a passcode; everything else lives on the server ---------- */
function askAccount(message = "") {
  if (document.querySelector(".veil.account")) return;
  let mode = "in";
  const veil = el("div", "veil account");
  veil.innerHTML = `<form class="pop card" role="dialog" aria-label="Your café card">
    <div class="titlebar"><img class="px" src="${A}icon_quill.png" alt="">Your café card</div>
    <div class="pop-body"><img class="px" src="${A}icon_coffee_big.png" alt="">
      <div class="lead">${esc(message || "Sign in to keep your conversations and notes.")}</div>
      <input class="codein" name="nickname" autocomplete="username" placeholder="Nickname" aria-label="Nickname" required minlength="3" maxlength="24">
      <input class="codein" name="passcode" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" required minlength="6">
      <p class="t14 err" role="alert" hidden></p>
      <div class="btns"><button class="btn go" type="submit">SIGN IN</button></div>
      <button class="switch t14" type="button">New here? Create a card</button></div></form>`;
  const err = $(".err", veil), go = $(".go", veil), sw = $(".switch", veil), pass = $('[name="passcode"]', veil);
  sw.onclick = () => {
    mode = mode === "in" ? "up" : "in";
    go.textContent = mode === "in" ? "SIGN IN" : "CREATE";
    sw.textContent = mode === "in" ? "New here? Create a card" : "Have a card? Sign in";
    pass.autocomplete = mode === "in" ? "current-password" : "new-password";
    $(".lead", veil).textContent = mode === "in" ? "Sign in to keep your conversations and notes." : "Pick a nickname and a passcode of six or more characters. There is no way to recover a forgotten passcode.";
    err.hidden = true;
  };
  $("form", veil).onsubmit = async e => {
    e.preventDefault();
    err.hidden = true; go.disabled = true;
    try {
      const j = await backend.api(mode === "in" ? "auth/login" : "auth/register",
                                  { method: "POST", body: { nickname: $('[name="nickname"]', veil).value.trim(), passcode: pass.value } });
      backend.setToken(j.token);
      veil.remove();
      await backend.loadMe(); await importLocalNotes(); await loadNotes();
      toast(`Welcome, ${j.nickname}`);
      if (screen === "convos") renderConvos(); else if (screen === "notes") renderNotes();
    } catch (x) {
      err.textContent = x.message || "That didn’t work. Please try again."; err.hidden = false;
    }
    go.disabled = false;
  };
  $(".screens").append(veil);
  $('[name="nickname"]', veil).focus();
}
function signOut() {
  backend.setToken(""); backend.me = null; notes = []; curThread = null;
  stopChat(); chat.innerHTML = ""; show("home");
  askAccount("You’re signed out.");
}
async function deleteAccount() {
  const ok = await confirmBox("Delete your café card?", "This deletes your account with every conversation, note and preference. It can’t be undone.", "DELETE");
  if (!ok) return;
  try { await backend.api("me", { method: "DELETE" }); } catch { return toast("Couldn’t delete just now"); }
  signOut();
}
// A yes/no window in the café's style; resolves true for the action.
function confirmBox(title, text, action) {
  return new Promise(resolve => {
    const veil = el("div", "veil");
    veil.innerHTML = `<div class="pop card" role="alertdialog" aria-label="${esc(title)}">
      <div class="titlebar">${esc(title)}</div>
      <div class="pop-body"><div>${esc(text)}</div>
        <div class="btns"><button class="btn" data-a="no">CANCEL</button><button class="btn danger" data-a="yes">${esc(action)}</button></div></div></div>`;
    const done = v => { veil.remove(); resolve(v); };
    veil.querySelector('[data-a="no"]').onclick = () => done(false);
    veil.querySelector('[data-a="yes"]').onclick = () => done(true);
    veil.onclick = e => { if (e.target === veil) done(false); };
    $(".screens").append(veil);
    veil.querySelector('[data-a="no"]').focus();
  });
}

/* ---------- Reply preferences (7.9): four dials from -2 to +2, kept with the account (7.10) ---------- */
const DIALS = { length: ["shorter replies", "longer replies"], plain: ["plainer words", "richer vocabulary"],
                questions: ["fewer questions back", "more questions back"], quotes: ["fewer quotes", "more quotes"] };
const prefs = {
  // Signed in: the account's dials (the server stores every change). The scripted demo keeps them on the device.
  get() { let v = {};
          if (backend.live) v = backend.me?.prefs || {};
          else { try { v = JSON.parse(localStorage.getItem("philocafe.prefs")) || {}; } catch {} }
          return Object.fromEntries(Object.keys(DIALS).map(k => [k, Math.max(-2, Math.min(2, Math.trunc(+v[k] || 0)))])); },
  set(v) { if (backend.live) { if (backend.me) backend.me.prefs = v; return; }
           try { localStorage.setItem("philocafe.prefs", JSON.stringify(v)); } catch {} },
  async reset() {
    if (backend.live) { const me = await backend.api("me", { method: "PATCH", body: { prefs: {} } }); backend.me = me; return; }
    try { localStorage.removeItem("philocafe.prefs"); } catch {}
  },
  // "shorter replies, plainer words" — what the dials currently ask for
  summary(v = this.get()) { return Object.keys(DIALS).filter(k => v[k]).map(k => (Math.abs(v[k]) === 2 ? "much " : "") + DIALS[k][v[k] > 0 ? 1 : 0]).join(", "); },
  // the offline rule (no server, or it failed): a thumbs-down on a long reply asks for shorter ones
  rule(rating, reply) { const v = this.get(); if (rating === "down" && reply.split(/\s+/).length > 120) v.length = Math.max(-2, v.length - 1); return v; },
  // the feedback window's tags without a server: one step per dial they name
  tags(rating, tags) { const v = this.get(), step = {};
    tags.forEach(t => { const [k, d] = FEEDBACK_TAGS[rating][t].dial; step[k] = (step[k] || 0) + d; });
    Object.keys(step).forEach(k => { v[k] = Math.max(-2, Math.min(2, v[k] + Math.sign(step[k]))); }); return v; }
};
// Long-press on a filled thumb opens these (the server keeps the same list, app/prefs.py).
const FEEDBACK_TAGS = {
  down: { too_long: { label: "Too long", dial: ["length", -1] }, too_short: { label: "Too short", dial: ["length", 1] },
          too_technical: { label: "Too technical", dial: ["plain", -1] }, too_many_questions: { label: "Too many questions", dial: ["questions", -1] },
          too_many_quotes: { label: "Too many quotes", dial: ["quotes", -1] } },
  up: { nice_and_short: { label: "Nice and short", dial: ["length", -1] }, nicely_detailed: { label: "Nicely detailed", dial: ["length", 1] },
        clear_words: { label: "Clear, everyday words", dial: ["plain", -1] }, good_questions: { label: "Good questions", dial: ["questions", 1] },
        liked_the_quotes: { label: "Liked the quotes", dial: ["quotes", 1] } }
};
const setMode = () => {
  const live = backend.live;
  document.querySelectorAll(".mode").forEach(m => { m.textContent = live ? "Live" : "Demo"; m.classList.toggle("live", live); m.title = live ? "Replies come from the PhiloCafe server" : "Scripted demo replies"; });
  $("#modeNote").textContent = live ? "Replies: live from the PhiloCafe server, with a safety check on every turn." : "Replies: scripted demo lines (open the page from the PhiloCafe server for live replies).";
};
backend.init().then(setMode);

function debugShow(ev) {
  let pre = $("#debugPanel");
  if (!pre) { pre = el("pre"); pre.id = "debugPanel"; document.body.append(pre); }
  const d = ev.data;
  if (ev.type === "safety") pre.dataset.safety = `tier ${d.tier} · p ${d.probability} vs ${d.threshold} · ${d.source} (${d.model_version})`;
  if (ev.type === "trace") pre.dataset.trace = `nodes ${d.nodes.map(n => `${n.name} ${Math.round(n.ms)}ms`).join(", ")}\nretrieved ${d.retrieved.join(", ") || "none"}`
    + (d.skipped.length ? `\nskipped ${d.skipped.map(x => `${x.chunk_id}: ${x.reason}`).join(", ")}` : "");
  pre.textContent = [pre.dataset.safety, pre.dataset.trace].filter(Boolean).join("\n");
}

/* ---------- 03 / 04 Conversation ---------- */
const chat = $("#chat");
let cur = null, curId = null, sceneActor = null, history = [], busy = false, fbIdx = 0, typer = null, citations = [];
let curThread = null;        // the open conversation's thread on the server (7.10); made on the first message

function sceneFor(p) {
  const wrap = el("div", "scene-wrap px");
  const d = DATA[p.land], [W, H] = d.size;
  const scene = el("div", "scene"); scene.style.aspectRatio = W + " / " + H;
  const frame = el("div", "frame");
  const bg = el("img", "px"); bg.src = A + d.scene; bg.alt = ""; Object.assign(bg.style, { position: "absolute", inset: 0, width: "100%", height: "100%" });
  sceneActor = actor(p.land, W, H);
  frame.append(bg, sceneActor); scene.append(frame); wrap.append(scene);
  return wrap;
}

function header(id, sub) {
  const p = PH[id];
  const head = el("header", "convhead");
  head.innerHTML = `<button class="back" aria-label="Back to the café">${icon("back")}</button>
    <img class="mono px" src="${A}mono_${id}.png" alt="">
    <div><h1>${p.name}</h1><p class="sub">${sub}</p></div>
    <span class="mode"></span>
    <button class="more" aria-label="More" aria-haspopup="menu" aria-expanded="false">${icon("more")}</button>`;
  $(".back", head).onclick = leaveChat;
  $(".more", head).onclick = e => { e.stopPropagation(); toggleMenu($(".more", head)); };
  return head;
}

// The ⋯ menu: Copy chat (the user test page relies on it) and the reply style the thumbs have set.
function toggleMenu(btn) {
  const open = document.querySelector(".menu");
  open?.remove(); document.querySelectorAll(".more").forEach(b => b.setAttribute("aria-expanded", "false"));
  if (open) return;
  const style = prefs.summary();
  const menu = el("div", "card menu");
  menu.setAttribute("role", "menu");
  menu.innerHTML = `<div class="inner"><button role="menuitem" data-a="copy">Copy chat</button>
    <p class="t11 muted style">REPLY STYLE · ${style ? esc(style.toUpperCase()) : "AS THE PHILOSOPHER LIKES"}</p>
    ${style ? `<button role="menuitem" data-a="reset">Reset reply style</button>` : `<p class="t14 muted" style="padding:2px 14px 6px">Thumbs up or down on a reply to tune it.</p>`}
    ${backend.me ? `<p class="t11 muted style">SIGNED IN AS ${esc(backend.me.nickname.toUpperCase())}</p>
      <button role="menuitem" data-a="out">Sign out</button><button role="menuitem" data-a="del" class="danger-text">Delete my café card</button>` : ""}</div>`;
  const close = () => { menu.remove(); btn.setAttribute("aria-expanded", "false"); document.removeEventListener("click", outside); };
  const outside = e => { if (!menu.contains(e.target)) close(); };
  menu.querySelector('[data-a="copy"]').onclick = () => { close(); copyChat(); };
  const reset = menu.querySelector('[data-a="reset"]');
  if (reset) reset.onclick = async () => { close(); try { await prefs.reset(); toast("Reply style reset"); } catch { toast("Couldn’t reset just now"); } };
  const out = menu.querySelector('[data-a="out"]'), del = menu.querySelector('[data-a="del"]');
  if (out) out.onclick = () => { close(); signOut(); };
  if (del) del.onclick = () => { close(); deleteAccount(); };
  $(".screens").append(menu);
  btn.setAttribute("aria-expanded", "true");
  setTimeout(() => document.addEventListener("click", outside));
  menu.querySelector("button").focus();
}

function buildChat(id) {
  const p = PH[id]; cur = p; curId = id; history = []; busy = false; fbIdx = 0; citations = []; curThread = null;
  pauseScene(); clearInterval(typer);
  chat.className = "screen";
  chat.innerHTML = "";
  const scroll = el("div", "scroll"); scroll.id = "scroll";
  scroll.innerHTML = `<h2 class="headline">${p.headline.replace("question ", "question<br>")}</h2>
    <div class="card greet"><div class="titlebar">${p.name}</div>
      <div class="body2"><img class="pic px" src="${A}mono_${id}.png" alt=""><div class="say" id="say"></div></div></div>
    <div class="label">Try a conversation starter</div>
    <div class="chips">${p.starters.map(s => `<button class="chip" data-s="${esc(s)}">→  ${esc(s)}</button>`).join("")}</div>`;
  scroll.querySelectorAll(".chip").forEach(c => c.onclick = () => send(c.dataset.s));
  const dock = el("div", "dock");
  dock.innerHTML = `<form class="composer">${icon("cup", "ink", 30)}
    <input id="msg" type="text" placeholder="Share a thought..." autocomplete="off" aria-label="Your message">
    <button class="send" type="submit" aria-label="Send">↑</button></form>`;
  $("form", dock).onsubmit = e => { e.preventDefault(); const v = $("#msg").value.trim(); if (v) { $("#msg").value = ""; send(v); } };
  chat.append(header(id, "A table for your thoughts"), sceneFor(p), scroll, dock);
  setMode();
  show("chat");
  return p;
}

// Taking a seat starts a new conversation (7.10); the Conversations tab reopens old ones.
function openChat(id) {
  if (isPaused() && paused?.id === id) return restorePaused();     // back to the conversation the pause set aside
  // Kept aside until the visitor sits down, so "Not yet" leaves the last conversation as it was.
  const prev = cur ? { nodes: [...chat.childNodes], cls: chat.className, cur, curId, history, fbIdx, citations, curThread } : null;
  const p = buildChat(id);
  backTo = "home";
  if (isPaused()) return enterSupport(p);

  // "A table for you" popup, as in the design
  const veil = el("div", "veil");
  veil.innerHTML = `<div class="pop card" role="dialog" aria-label="A table for you">
    <div class="titlebar"><img class="px" src="${A}icon_quill.png" alt="">A table for you<button class="x" aria-label="Not yet">×</button></div>
    <div class="pop-body"><img class="px" src="${A}icon_coffee_big.png" alt="">
      <div>${p.name} has saved you a seat.<br>Would you like to sit down?</div>
      <div class="btns"><button class="btn" data-a="no">NOT YET</button><button class="btn go" data-a="yes">SIT DOWN</button></div></div></div>`;
  const back = () => {
    veil.remove();
    if (prev) {
      pauseScene();
      chat.replaceChildren(...prev.nodes); chat.className = prev.cls;
      ({ cur, curId, history, fbIdx, citations, curThread } = prev);
      busy = false; const s = $(".send", chat); if (s) s.disabled = false;
    } else stopChat();
    openMeet(id);
  };
  veil.querySelector('[data-a="no"]').onclick = back;
  veil.querySelector(".x").onclick = back;
  veil.querySelector('[data-a="yes"]').onclick = () => { veil.remove(); typeInto($("#say"), p.greet); };
  $(".screens").append(veil);
  veil.querySelector('[data-a="yes"]').focus();
}

function stopChat() { pauseScene(); clearInterval(typer); cur = null; curId = null; }
function pauseScene() { sceneActor?.stop(); sceneActor = null; }

// Leaving for the café keeps the conversation; the Conversation tab brings it back.
let backTo = "home";
function leaveChat() { pauseScene(); if (backTo === "convos") { renderConvos(); show("convos"); } else show("home"); }
function resumeChat() {
  syncBookmarks();
  if (paused && isPaused()) return restorePaused();
  if (!cur || !$(".dock", chat)) return noChatYet();
  const wrap = $(".scene-wrap", chat);
  if (wrap && !sceneActor) wrap.replaceWith(sceneFor(cur));      // restart the scene animation
  show("chat"); scrollDown();
}
function noChatYet() {
  show("home");
  const veil = el("div", "veil");
  veil.innerHTML = `<div class="pop card" role="dialog" aria-label="No conversation yet">
    <div class="titlebar"><img class="px" src="${A}icon_quill.png" alt="">No conversation yet<button class="x" aria-label="Close">×</button></div>
    <div class="pop-body"><img class="px" src="${A}icon_coffee_big.png" alt="">
      <div>Tap a philosopher in the café<br>and take a seat to start talking.</div>
      <div class="btns"><button class="btn go">OK</button></div></div></div>`;
  veil.onclick = e => { if (e.target === veil || e.target.closest(".x, .btn")) veil.remove(); };
  $(".screens").append(veil);
  $(".btn", veil).focus();
}

function typeInto(node, text, done) {
  clearInterval(typer);
  if (reduce) { node.textContent = text; done?.(); return; }
  let i = 0; node.textContent = ""; node.classList.add("typing");
  typer = setInterval(() => {
    i += 1; node.textContent = text.slice(0, i); if (chat.classList.contains("convo")) scrollDown();
    if (i >= text.length) { clearInterval(typer); node.classList.remove("typing"); done?.(); }
  }, 24);
}
const scrollDown = () => { const s = $("#scroll"); if (s) s.scrollTop = s.scrollHeight; };

function bubble(who, text) {
  if (who === "me") document.querySelectorAll(".acts.latest").forEach(a => a.classList.remove("latest"));
  const row = el("div", "row " + who);
  if (who === "them") row.append(Object.assign(el("img", "ava px"), { src: `${A}mono_${curId}.png`, alt: "" }));
  const b = el("div", "bubble"); b.textContent = text ?? "";
  row.append(b); row.insertAdjacentHTML("beforeend", TAIL[who]);
  $("#scroll").append(row); scrollDown();
  return b;
}

// Severe-distress signals only; ordinary sadness or philosophical pessimism should not pause the café.
const DISTRESS = /(kill(ing)? myself|suicid|end (it all|my life)|want(ed)? to die|don.?t want to (live|be alive|wake up)|hurt(ing)? myself|self.?harm|(don.?t|do not) feel safe with myself|no reason to live|自杀|自殘|自残|不想活|活不下去|想死|伤害自己|傷害自己|结束(我的)?生命)/i;

// first message: drop the welcome card and start the thread with the greeting
function startConvo(p) {
  if (chat.classList.contains("convo")) return;
  clearInterval(typer);
  chat.classList.add("convo");
  $("#scroll").innerHTML = "";
  bubble("them", p.greet);
  history.push({ role: "assistant", content: p.greet });
}

// A system-voice card in the thread: support-mode replies, never the persona's voice (NFR-12).
function systemCard(text, resources) {
  const card = el("div", "card sysnote");
  card.innerHTML = `<div class="titlebar">A moment of care</div><div class="inner"><p class="t16"></p></div>`;
  $(".t16", card).textContent = text;
  (resources || []).forEach(r => { const row = el("p", "t14"); row.innerHTML = `<b>${esc(r.name)}</b>: ${esc(r.contact)}`; $(".inner", card).append(row); });
  $("#scroll").append(card); scrollDown();
}

// A pause (FR-32) sets the conversation aside instead of throwing it away. Reopening it, or
// any philosopher, during the pause shows the support card and the way back: a button, then two
// fixed replies, so the visitor never has to guess what to say. The server decides; in the demo
// the scripted check stands in.
let paused = null;          // { id, nodes, cls, history, fbIdx, citations } of the conversation set aside
let demoPaused = false;
const isPaused = () => backend.live ? backend.paused() : demoPaused;
const READY = p => `I’m ready to talk with ${p.name} again`;
const SAFE = p => `I’m safe right now, and I’d like to keep talking with ${p.name}.`;
const HARD = "I’m still having a hard time.";

function setAside(id) {
  if (cur && curId === id && $(".dock", chat)) paused = { id, nodes: [...chat.childNodes], cls: chat.className, history, fbIdx, citations };
}
function restorePaused() {
  const s = paused; paused = null;
  pauseScene(); clearInterval(typer);
  cur = PH[s.id]; curId = s.id; ({ history, fbIdx, citations } = s); busy = false;
  chat.replaceChildren(...s.nodes); chat.className = s.cls;
  $(".scene-wrap", chat)?.replaceWith(sceneFor(cur));
  const btn = $(".send", chat); if (btn) btn.disabled = false;
  setMode(); show("chat");
  enterSupport(cur);
}
function enterSupport(p) {
  clearInterval(typer);
  if (!chat.classList.contains("convo")) { chat.classList.add("convo"); $("#scroll").innerHTML = ""; }
  systemCard(`This conversation is paused, and ${p.name} is waiting nearby. You can tell me how you are. When you feel ready, tap the button below.`);
  $("#msg").placeholder = "Say how you are…";
  comeBack(p);
}
function comeBack(p, step = "ask") {
  let box = $(".comeback", chat);
  if (!box) { box = el("div", "comeback"); $(".dock", chat).prepend(box); }
  if (step === "ask") {
    box.innerHTML = `<button class="chip ready" type="button">→  ${esc(READY(p))}</button>`;
    $(".ready", box).onclick = () => comeBack(p, "check");
  } else {
    box.innerHTML = `<p class="t14">Before ${esc(p.name)} comes back, how are you feeling right now?</p>
      <div class="chips"><button class="chip" type="button" data-a="safe">→  ${esc(SAFE(p))}</button>
      <button class="chip" type="button" data-a="hard">→  ${esc(HARD)}</button></div>`;
    box.querySelector('[data-a="safe"]').onclick = () => checkIn(p, true);
    box.querySelector('[data-a="hard"]').onclick = () => checkIn(p, false);
  }
  scrollDown();
}
function leaveSupport() {
  $(".comeback", chat)?.remove();
  $("#msg").placeholder = "Share a thought...";
}
async function checkIn(p, safe) {
  if (busy) return;
  const text = safe ? SAFE(p) : HARD;
  if (backend.live) return sendLive(text, safe ? "return" : null);
  bubble("me", text);
  history.push({ role: "user", content: text });
  if (!safe) {
    systemCard(`Thank you for telling me. ${p.name} will wait a little longer. If you might be in danger, please reach out to someone who can help right away. Whenever you’re ready, you can try again.`);
    return comeBack(p);
  }
  demoPaused = false; leaveSupport();
  busy = true;
  const b = bubble("them");
  await new Promise(r => typeInto(b, "I’m glad you’re here. Let’s go on gently, at your own pace. Where would you like to begin?", r));
  history.push({ role: "assistant", content: b.textContent });
  addActions(b, { who: curId, you: text, them: b.textContent, cites: [] });
  busy = false;
}

// Reads one turn's events into bubble `b` (7.2); shared by a new message and Regenerate.
async function streamInto(b, events) {
  const out = { voice: null, said: "", cites: [], resources: null, reason: null, failed: null, messageId: null };
  try {
    for await (const ev of events) {
      const d = ev.data;
      if (ev.type === "voice") {
        out.voice = d.speaker;
        if (out.voice === "persona") { b.textContent = ""; backend.setPaused(false); leaveSupport(); }
      } else if (ev.type === "token") {
        out.said += d.text;
        if (out.voice === "persona") { b.textContent += d.text; scrollDown(); }
      } else if (ev.type === "citation" && out.voice === "persona") {
        citations.push(d); out.cites.push({ ...d, n: citations.length });
        b.textContent += ` [${citations.length}]`;     // matches the numbered entry in "From the source"
      } else if (ev.type === "exit") { out.resources = d.resources; out.reason = d.reason; }
      else if (ev.type === "error") out.failed = d;
      else if (ev.type === "done") out.messageId = d.message_id || null;
      if (DEBUG && (ev.type === "safety" || ev.type === "trace")) debugShow(ev);
    }
  } catch (e) { out.failed = { code: "network", message: String(e) }; }
  return out;
}

async function sendLive(text, intent = null) {
  const id = curId;
  busy = true; $(".send").disabled = true;
  startConvo(cur);
  bubble("me", text);
  history.push({ role: "user", content: text });
  const b = bubble("them");
  b.innerHTML = '<span class="dots" aria-label="typing"><i></i><i></i><i></i></span>';
  let r;
  try {
    if (!curThread) curThread = await backend.newThread(id);       // the first message makes the conversation
    r = await streamInto(b, backend.turn(curThread, text, intent));
  } catch (e) { r = { failed: { code: e.code || "network" } }; }
  busy = false; $(".send").disabled = false;
  if (r.voice === "system") {
    b.closest(".row").remove();
    backend.setPaused(true);
    if (r.reason === "tier_3") return distress(id, text, { text: r.said, resources: r.resources });
    systemCard(r.said, r.resources);
    return comeBack(PH[id]);
  }
  if (r.failed || r.voice !== "persona") {          // never stand in for the persona with a made-up reply
    b.closest(".row").remove();
    $("#scroll").append(el("p", "t11 muted netnote", "The café could not answer just now. Please try again."));
    return scrollDown();
  }
  history.push({ role: "assistant", content: r.said });
  addActions(b, { who: id, you: text, them: b.textContent, cites: r.cites, thread: curThread, messageId: r.messageId });
  scrollDown();
}

/* ---------- Reply actions (7.9): save, copy, source, thumbs, regenerate ---------- */
function addActions(b, ex) {
  const row = b.closest(".row");
  row.nextElementSibling?.classList.contains("acts") && row.nextElementSibling.remove();
  document.querySelectorAll(".acts.latest").forEach(a => a.classList.remove("latest"));
  const acts = el("div", "acts latest");
  acts.setAttribute("role", "toolbar"); acts.setAttribute("aria-label", "Reply actions");
  acts._ex = { rating: null, noteId: null, ...ex };
  const btn = (a, label, ico) => `<button type="button" data-a="${a}" class="${a}" aria-label="${label}" title="${label}">${icon(ico, "muted", 18)}</button>`;
  acts.innerHTML = btn("save", "Save to My notes", "mark") + btn("copy", "Copy", "copy") +
    (ex.cites.length ? btn("source", "From the source", "book") : "") +
    btn("up", "Good reply", "up") + btn("down", "Bad reply", "down") + btn("regen", "Regenerate", "regen");
  acts.querySelectorAll("button").forEach(x => x.onclick = () => { if (x._held) { x._held = false; return; } ACTIONS[x.dataset.a](acts, x); });
  acts.querySelectorAll(".up, .down").forEach(x => longPress(x, () => { if (acts._ex.rating === x.dataset.a) openFeedback(acts, x.dataset.a); }));
  row.after(acts);
  if (acts._ex.rating) paintThumbs(acts);
  if (acts._ex.noteId) markSaved($(".save", acts), true);
  return acts;
}
// Selected = the filled icon, unselected = the outline; no frame or background.
const setIcon = (x, name, color = "muted") => { x.innerHTML = icon(name, color, 18); };
const markSaved = (x, on) => { x.setAttribute("aria-pressed", on); x.setAttribute("aria-label", on ? "Remove from My notes" : "Save to My notes"); setIcon(x, on ? "markFull" : "mark", on ? "ink" : "muted"); };
// A note deleted in My notes empties its bookmark when the chat comes back.
const syncBookmarks = () => document.querySelectorAll(".acts").forEach(a => {
  if (a._ex.noteId && !notes.some(n => n.id === a._ex.noteId)) { a._ex.noteId = null; markSaved($(".save", a), false); }
});

const ACTIONS = {
  async save(acts, x) {             // tap again to take the note back out of My notes
    const ex = acts._ex;
    if (ex.noteId && notes.some(n => n.id === ex.noteId)) {
      await removeNote(ex.noteId); ex.noteId = null;
      markSaved(x, false);
      return toast("Removed from My notes");
    }
    x.disabled = true;
    try { ex.noteId = await saveExchange(ex); } catch { x.disabled = false; return toast("Couldn’t save just now"); }
    x.disabled = false; markSaved(x, true);
    toast("Saved to My notes");
  },
  async copy(acts) {
    toast(await copyText(acts._ex.them) ? "Copied" : "Couldn’t copy. Press and hold the reply to copy it.");
  },
  source(acts) { openSource(acts._ex.cites); },
  up(acts, x) { rate(acts, x, "up"); },
  down(acts, x) { rate(acts, x, "down"); },
  regen(acts) { regenerate(acts); }
};

// Long press (about half a second) on a button; the click that follows it is swallowed.
function longPress(x, fn) {
  let t = null;
  const stop = () => clearTimeout(t);
  x.addEventListener("pointerdown", () => { stop(); t = setTimeout(() => { x._held = true; fn(); }, 500); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(e => x.addEventListener(e, stop));
  x.addEventListener("contextmenu", e => e.preventDefault());
}

// The feedback window (7.9): tags and a short note on a rated reply. They only move the reply-style
// dials (the note is read by the server's model, never put in the persona's prompt, FR-37).
function openFeedback(acts, rating) {
  const ex = acts._ex, picked = new Set(ex.feedback?.tags || []);
  const veil = el("div", "veil");
  veil.innerHTML = `<form class="pop card feedback" role="dialog" aria-label="Feedback">
    <div class="titlebar"><span>${rating === "up" ? "What worked?" : "What missed?"}</span><button class="x" type="button" aria-label="Close">×</button></div>
    <div class="inner">
      <p class="t14 muted">${esc(PH[ex.who].name)} will keep this in mind for the next replies.</p>
      <div class="tags">${Object.entries(FEEDBACK_TAGS[rating]).map(([k, t]) => `<button type="button" class="tag" data-t="${k}" aria-pressed="${picked.has(k)}">${esc(t.label)}</button>`).join("")}</div>
      <textarea maxlength="500" placeholder="Anything else? (optional)" aria-label="Your feedback">${esc(ex.feedback?.text || "")}</textarea>
      <div class="btns"><button class="btn" type="button" data-a="cancel">CANCEL</button><button class="btn go" type="submit">SEND</button></div>
    </div></form>`;
  veil.querySelectorAll(".tag").forEach(b => b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); on ? picked.add(b.dataset.t) : picked.delete(b.dataset.t); });
  const close = () => veil.remove();
  $(".x", veil).onclick = close; $('[data-a="cancel"]', veil).onclick = close;
  veil.onclick = e => { if (e.target === veil) close(); };
  $("form", veil).onsubmit = async e => {
    e.preventDefault();
    const feedback = { tags: [...picked], text: $("textarea", veil).value.trim() };
    if (!feedback.tags.length && !feedback.text) return close();
    ex.feedback = feedback;
    $(".go", veil).disabled = true;
    let next = null;
    if (backend.live && ex.messageId) { try { next = await backend.rate(rating, ex, feedback); } catch {} }
    prefs.set(next || prefs.tags(rating, feedback.tags));
    close();
    toast("Thanks, noted");
  };
  $(".screens").append(veil);
  $(".tag", veil).focus();
}

const paintThumbs = acts => acts.querySelectorAll(".up, .down").forEach(b => {
  const on = b.dataset.a === acts._ex.rating; b.setAttribute("aria-pressed", on); setIcon(b, b.dataset.a + (on ? "Full" : ""), on ? "ink" : "muted");
});

// A thumb (7.9): toggles the rating; a new rating asks the server how to move the reply style.
async function rate(acts, x, rating) {
  const ex = acts._ex;
  const off = ex.rating === rating;
  ex.rating = off ? null : rating; ex.feedback = null;
  paintThumbs(acts);
  if (off) { if (backend.live && ex.messageId) backend.rate("none", ex).catch(() => {}); return; }
  let next = null;
  if (backend.live && ex.messageId) { try { next = await backend.rate(rating, ex); } catch {} }
  next = next || prefs.rule(rating, ex.them);
  prefs.set(next);                   // silent: the ⋯ menu shows the reply style
}

// Regenerate (FR-41): the latest reply is answered again and replaces the old one in place.
async function regenerate(acts) {
  if (busy) return;
  const ex = acts._ex, row = acts.previousElementSibling, b = $(".bubble", row);
  const old = b.textContent;
  busy = true; $(".send").disabled = true;
  acts.querySelectorAll("button").forEach(x => x.disabled = true);
  b.innerHTML = '<span class="dots" aria-label="typing"><i></i><i></i><i></i></span>';
  let said = null, cites = [];
  if (backend.live) {
    const r = await streamInto(b, backend.turn(ex.thread, null, null, true));
    if (r.voice === "system") {                      // the safety node decides again; it may pause
      busy = false; $(".send").disabled = false;
      row.remove(); acts.remove(); history.pop();
      backend.setPaused(true);
      if (r.reason === "tier_3") return distress(ex.who, ex.you, { text: r.said, resources: r.resources });
      systemCard(r.said, r.resources);
      return comeBack(PH[ex.who]);
    }
    if (!r.failed && r.voice === "persona") { said = b.textContent; cites = r.cites; ex.messageId = r.messageId; }
  } else {
    const p = PH[ex.who];
    const reply = p.fallback[fbIdx++ % p.fallback.length];
    await new Promise(r => setTimeout(r, reduce ? 0 : 700));
    await new Promise(r => typeInto(b, reply, r));
    said = reply;
  }
  busy = false; $(".send").disabled = false;
  if (said == null) { b.textContent = old; acts.querySelectorAll("button").forEach(x => x.disabled = false); return toast("Couldn’t regenerate just now"); }
  const last = history.map(m => m.role).lastIndexOf("assistant");
  if (last >= 0) history[last].content = said;
  addActions(b, { ...ex, them: said, cites });
  scrollDown();
}

async function send(text) {
  if (busy) return;
  if (backend.live) return sendLive(text);
  const p = cur;
  if (DISTRESS.test(text)) return distress(curId, text);   // demo only; live pauses come from the server
  if (demoPaused) {
    startConvo(p);
    bubble("me", text);
    history.push({ role: "user", content: text });
    systemCard(`I’m still here with you, and ${p.name} is staying aside for now. When you feel ready, tap the button below. If you might be in danger, please reach out to someone who can help right away.`);
    return comeBack(p);
  }
  busy = true; $(".send").disabled = true;
  startConvo(p);
  bubble("me", text);
  history.push({ role: "user", content: text });
  const b = bubble("them");
  b.innerHTML = '<span class="dots" aria-label="typing"><i></i><i></i><i></i></span>';

  // Demo mode: scripted lines only.
  const reply = (history.length === 2 && p.scripted[text]) || p.fallback[fbIdx++ % p.fallback.length];
  await new Promise(r => setTimeout(r, reduce ? 0 : 1100));
  await new Promise(r => typeInto(b, reply, r));
  history.push({ role: "assistant", content: reply });
  addActions(b, { who: curId, you: text, them: reply, cites: [] });
  busy = false; $(".send").disabled = false; scrollDown();
}

/* ---------- Source card ---------- */
function openSource(list = citations.map((c, i) => ({ ...c, n: i + 1 }))) {
  if (!list.length) return;     // nothing quoted, nothing to show
  const veil = el("div", "veil");
  veil.innerHTML = `<div class="pop card source" role="dialog" aria-label="From the source">
    <div class="titlebar">From the source</div><div class="inner"></div></div>`;
  const inner = $(".inner", veil);
  list.forEach(c => {
    const where = c.section ? `${c.work}, ${c.section}` : c.work;
    const block = el("div", "cite");
    block.innerHTML = `<p class="t11 muted">[${c.n}] ${esc(where)}</p>
      ${c.quote ? `<blockquote class="t16">${esc(c.quote)}</blockquote>` : ""}
      ${c.passage ? `<details><summary class="t14">Full passage</summary><p class="t14 passage">${esc(c.passage)}</p></details>` : ""}
      <a class="t14" href="${esc(c.source_url)}" target="_blank" rel="noopener">Read it in the source ↗</a>`;
    inner.append(block);
  });
  inner.append(Object.assign(el("button", "close", "Close ×"), { type: "button" }));
  veil.onclick = e => { if (e.target === veil || e.target.closest(".close")) veil.remove(); };
  $(".screens").append(veil);
  $(".close", veil).focus();
}

/* ---------- My notes (7.7): stored with the account (7.10); the scripted demo keeps them on the device ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem("philocafe.notes")) || null; } catch { return null; } },
  set(v) { if (!backend.live) { try { localStorage.setItem("philocafe.notes", JSON.stringify(v)); } catch {} } }
};
const SAMPLE = "sample";            // seeded example (demo only); leaves once a real note is saved
const sampleFrom = { you: "I feel like I’m falling behind.", them: PH.socrates.scripted["I feel like I’m falling behind."], cites: [] };
let notes = store.get() || [{ id: SAMPLE, who: "socrates", ...PH.socrates.sample, from: sampleFrom, reflection: "" }];
const sample = notes.find(n => n.id === SAMPLE);
if (sample && !sample.from) { sample.from = sampleFrom; store.set(notes); }
const dropSample = () => { notes = notes.filter(n => n.id !== SAMPLE || (n.reflection || "").trim()); };
if (notes.length > 1) { dropSample(); store.set(notes); }
let filter = "all";
const fromServer = n => ({ ...n, who: n.persona_id });
async function loadNotes() {
  if (!backend.live || !backend.me) return;
  notes = (await backend.api("notes")).map(fromServer);
}
// Notes a device kept before accounts move to the account once, at the first sign-in.
async function importLocalNotes() {
  const local = (store.get() || []).filter(n => n.id !== SAMPLE);
  for (const n of local.slice().reverse()) { try { await backend.api("notes", { method: "POST", body: { note: { ...n, persona_id: n.who } } }); } catch {} }
  try { localStorage.removeItem("philocafe.notes"); localStorage.removeItem("philocafe.prefs"); localStorage.removeItem("philocafe.visit"); } catch {}
}
async function removeNote(id) {
  if (backend.live) await backend.api(`notes/${id}`, { method: "DELETE" }).catch(() => {});
  notes = notes.filter(n => n.id !== id); store.set(notes);
}
let reflectTimer = null;
function saveReflection(n, text) {
  n.reflection = text;
  if (!backend.live) return store.set(notes);
  clearTimeout(reflectTimer);
  reflectTimer = setTimeout(() => backend.api(`notes/${n.id}`, { method: "PATCH", body: { reflection: text } }).catch(() => {}), 600);
}
function savedOn(n) {
  let d = n.created_at ? new Date(n.created_at) : null;
  if (!d) { const t = parseInt(n.id, 36); if (n.id === SAMPLE || !Number.isFinite(t) || t < 1.6e12) return ""; d = new Date(t); }
  const opts = { month: "short", day: "numeric" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("en-US", opts);
}

function toast(msg) {
  document.querySelector(".toast")?.remove();
  const dock = $("#chat .dock");
  if (!dock) return;
  const t = el("div", "toast", esc(msg)); dock.append(t);
  setTimeout(() => t.remove(), 1800);
}

const lastQuestion = s => { const parts = s.match(/[^.!?。！？]+[.!?。！？]*/g) || [s]; return (parts.filter(x => /[?？]/.test(x)).pop() || parts[0]).trim(); };

// Bookmark (7.7): the exchange becomes a note. Signed in, the server distils a title and stores the
// note with the account; in the scripted demo the reply's question stands in and the note stays here.
async function saveExchange(ex) {
  if (backend.live) {
    const n = fromServer(await backend.note(ex));
    notes.unshift(n);
    return n.id;
  }
  const p = PH[ex.who];
  let note = null;
  if (ex.who === "socrates" && ex.you === sampleFrom.you && ex.them === sampleFrom.them) note = { ...p.sample };
  if (!note) note = { title: lastQuestion(ex.them), why: ex.you ? `From your talk about “${ex.you}”.` : "A thought to revisit later.", topic: "From your conversation" };
  const cites = ex.cites.map(c => ({ n: c.n, where: c.section ? `${c.work}, ${c.section}` : c.work, quote: c.quote || "", passage: c.passage || "", url: c.source_url || "" }));
  const n = { id: Date.now().toString(36), who: ex.who, reflection: "", ...note, from: { you: ex.you, them: ex.them, cites } };
  dropSample(); notes.unshift(n); store.set(notes);
  return n.id;
}

// Copy chat (user test, ui/web/test.html): the whole conversation as plain text, headed
// "Philocafé · <name> · <date>" so the test page can tell who it was with.
function chatText() {
  const name = cur?.name || "Philosopher";
  const date = new Date().toLocaleDateString("en-US");
  const turns = history.map(m => `${m.role === "user" ? "Me" : name}: ${m.content.trim()}`);
  return [`Philocafé · ${name} · ${date}`, ...turns].join("\n\n");
}
async function copyChat() {
  if (!history.some(m => m.role === "user")) return toast("Say something first");
  toast(await copyText(chatText()) ? "Chat copied" : "Couldn’t copy. Press and hold each message to copy it.");
}
async function copyText(text) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch {}
  if (!ok) {          // older iOS, or a page opened without HTTPS
    const ta = Object.assign(document.createElement("textarea"), { value: text, readOnly: true });
    Object.assign(ta.style, { position: "fixed", top: 0, left: 0, opacity: 0 });
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
  }
  return ok;
}

  veil.innerHTML = `<div class="pop card notepop" role="dialog" aria-label="Saved thought">

      <p class="t28">${esc(n.title)}</p>
      <p class="t16">${esc(n.why)}</p>
      <hr>
      <p class="label muted">From your conversation</p>
      ${n.from ? `<div class="excerpt">
        ${n.from.you ? `<div class="line me"><p class="who">You</p><p class="t14">${esc(n.from.you)}</p></div>` : ""}
        <div class="line them"><p class="who">${PH[n.who].name}</p><p class="t14">${esc(n.from.them)}</p>
          ${n.from.cites?.length ? `<div class="cites">${n.from.cites.map(c => `<div class="cite"><p class="t11 muted">[${c.n}] ${esc(c.where)}</p>
            ${c.quote ? `<blockquote class="t14">${esc(c.quote)}</blockquote>` : ""}
            ${c.passage ? `<details><summary class="t14">Full passage</summary><p class="t14 passage">${esc(c.passage)}</p></details>` : ""}
            ${c.url ? `<a class="t14" href="${esc(c.url)}" target="_blank" rel="noopener">Read it in the source ↗</a>` : ""}</div>`).join("")}</div>` : ""}</div>
      </div>` : `<p class="t14 muted">This note was saved before the café kept the conversation with it.</p>`}
      <hr>
      <p class="t20">Your reflection</p>
      <textarea placeholder="What does this question bring up for you?" aria-label="Your reflection">${esc(n.reflection || "")}</textarea>
      <div class="btns"><button class="btn del" type="button">DELETE</button><button class="btn go done" type="button">DONE</button></div>
    </div></div>`;
  const close = () => { veil.remove(); renderNotes(); };

  $(".done", veil).focus();
}

/* ---------- Conversations tab (FR-44): sections by philosopher, cards to reopen ---------- */
const ORDER = ["socrates", "montaigne", "schopenhauer", "seneca", "epictetus"];
const ago = iso => {
  const d = new Date(iso), mins = (Date.now() - d) / 60000;
  if (mins < 1) return "just now";
  if (mins < 60) return `${Math.floor(mins)} min ago`;
  if (mins < 1440) return `${Math.floor(mins / 60)} h ago`;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", ...(d.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) });
};
async function renderConvos() {
  const v = $("#convos");
  const head = `<p class="t28">Your conversations</p><p class="t16 muted">Pick up where you left off, or start fresh.</p>`;
  if (!backend.live || !backend.me) {
    v.innerHTML = `<div class="body">${head}
      <div class="card empty t16 muted">${backend.live ? "Sign in to keep your conversations." : "Saved conversations need the PhiloCafé server; this demo keeps only the one open now."}</div>
      ${cur ? `<button class="primary" id="resumeBtn">Back to ${esc(cur.name)}</button>` : ""}
      ${backend.live ? `<button class="primary" id="signBtn">Sign in</button>` : ""}</div>`;
    $("#resumeBtn", v) && ($("#resumeBtn", v).onclick = resumeChat);
    $("#signBtn", v) && ($("#signBtn", v).onclick = () => askAccount());
    return;
  }
  if (!v.firstChild) v.innerHTML = `<div class="body">${head}<p class="t14 muted">Loading…</p></div>`;
  let rows = [];
  try { rows = await backend.threads(); } catch { v.innerHTML = `<div class="body">${head}<div class="card empty t16 muted">The café could not load your conversations just now.</div></div>`; return; }
  const by = Object.fromEntries(ORDER.map(id => [id, rows.filter(r => r.persona_id === id)]));
  const order = [...ORDER].sort((a, b) => (by[b][0]?.updated_at || "").localeCompare(by[a][0]?.updated_at || ""));
  v.innerHTML = `<div class="body">${head}
    ${order.filter(id => backend.available(id)).map(id => `<section class="csec" aria-label="${PH[id].name}">
      <div class="csec-head"><img class="px" src="${A}mono_${id}.png" alt=""><h2>${PH[id].name}</h2>
        <button class="newc" data-new="${id}">+ New</button></div>
      ${by[id].length ? by[id].map(r => `<button class="card ccard" data-t="${r.thread_id}">
          <div class="titlebar"><span class="when">${ago(r.updated_at)}</span><span class="x" role="button" tabindex="0" data-del="${r.thread_id}" aria-label="Delete this conversation">×</span></div>
          <div class="inner"><p class="ctitle">${esc(r.title)}</p><p class="t14 muted last">${esc(r.last_line)}</p></div></button>`).join("")
        : `<button class="cempty t14" data-new="${id}">No conversations with ${PH[id].name} yet. Take a seat →</button>`}
    </section>`).join("")}</div>`;
  v.querySelectorAll("[data-new]").forEach(b => b.onclick = () => { pauseScene(); openChat(b.dataset.new); });
  v.querySelectorAll(".ccard").forEach(b => b.onclick = e => {
    const del = e.target.closest("[data-del]");
    if (del) return deleteConvo(rows.find(r => r.thread_id === del.dataset.del));
    openThread(rows.find(r => r.thread_id === b.dataset.t));
  });
}
async function deleteConvo(r) {
  const ok = await confirmBox("Delete this conversation?", `“${r.title}” with ${PH[r.persona_id].name} will be gone for good. Notes you saved from it stay.`, "DELETE");
  if (!ok) return;
  try { await backend.deleteThread(r.thread_id); } catch { return; }
  if (curThread === r.thread_id) { stopChat(); chat.innerHTML = ""; curThread = null; }
  renderConvos();
}
// Reopen a stored conversation with its history (7.10); replies keep their sources, ratings and bookmarks.
async function openThread(r) {
  let h;
  try { h = await backend.history(r.thread_id); } catch { return; }
  const p = buildChat(r.persona_id);
  curThread = r.thread_id; backTo = "convos";
  startConvo(p);
  let you = "";
  for (const m of h.messages) {
    if (m.role === "user") { you = m.text; bubble("me", m.text); history.push({ role: "user", content: m.text }); }
    else if (m.role === "system") systemCard(m.text);
    else {
      const cites = (m.citations || []).map(c => { citations.push(c); return { ...c, n: citations.length }; });
      const b = bubble("them", m.text + cites.map(c => ` [${c.n}]`).join(""));
      history.push({ role: "assistant", content: m.text });
      addActions(b, { who: r.persona_id, you, them: m.text, cites, thread: r.thread_id, messageId: m.id,
                      rating: m.rating || null, noteId: notes.find(n => n.message_id === m.id)?.id || null });
    }
  }
  document.querySelectorAll(".acts").forEach(a => a.classList.remove("latest"));
  const lastActs = [...document.querySelectorAll("#scroll > *")].pop();
  if (lastActs?.classList.contains("acts")) lastActs.classList.add("latest");     // only a final persona reply can be regenerated
  backend.setPaused(h.paused);
  if (h.paused) enterSupport(p);
  scrollDown();
}

/* ---------- 07 System detects distress → 06 Pause the café ---------- */
let pauseTimer = null;
function distress(id, text, care) {
  setAside(id);
  if (!backend.live) demoPaused = true;
  stopChat();
  const p = PH[id];
  const c = $("#chat");
  c.className = "screen"; c.innerHTML = "";
  const body = el("div", "body");
  body.style.gap = "18px";
  const [head, ...rest] = care?.text ? care.text.split(/(?<=[.!?])\s+/) : ["Let’s take a moment.", "You deserve support with what you’re carrying. We’re pausing this conversation to make room for that."];
  body.innerHTML = `<p class="t11 muted syscheck">${care ? "SAFETY CHECK" : "PROTOTYPE · SIMULATED SYSTEM CHECK"}</p>
    <div class="youcard"><p class="t11">YOU · AT THIS TABLE</p><p class="t16">${esc(text)}</p></div>
    <div class="card"><div class="titlebar">A moment of care</div>
      <div class="inner"><p class="t20">${esc(head)}</p><p class="t16">${esc(rest.join(" "))}</p></div></div>`;
  const dock = el("div", "dock");
  dock.innerHTML = `<div class="composer quiet" aria-disabled="true"><span>What’s on your mind?</span><span>↑</span></div><p class="note t11 muted">${care ? "AI interpretation" : "AI interpretation · Demo conversation"}</p>`;
  c.append(header(id, "On finding your own pace"), body, dock);
  $(".back", c).onclick = () => { clearTimeout(pauseTimer); show("home"); };
  setMode(); show("chat");
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(() => openPause(care?.resources), 2000);
}

function openPause(resources) {
  const v = $("#pause");
  v.innerHTML = `<img class="rest px" src="${A}cafe_rest.png" alt="The café, quiet and at rest">
    <div class="body">
      <div class="titlebar">A moment of care</div>
      <p class="t20">Let’s pause the café<br>for a moment.</p>
      <p class="t16">Some thoughts need a real person alongside you. Take your time, and reach out to someone you trust.</p>

        : `<div class="card support"><p class="t16">Local support</p><p class="t14">Find a crisis or support service in your area.</p></div>
      <div class="card support"><p class="t16">Campus or community counseling</p><p class="t14">Arrange time to talk with a counselor.</p></div>`}
      <div class="card support"><p class="t16">Someone you trust</p><p class="t14">A friend, family member, or mentor.</p></div>
      <button class="primary">Return to the café</button>
      ${resources?.length ? "" : `<p class="t11">Support options shown for prototype review.</p>`}
    </div>`;
  $(".primary", v).onclick = () => show("home");
  show("pause");
}
